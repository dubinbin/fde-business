<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101412"><title>推送回应</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;gap:20px;background:#101412;font-family:Arial,sans-serif}button{width:128px;height:72px;border:1px solid #c4f677;border-radius:14px;background:#c4f677;color:#16200b;font-size:26px;cursor:pointer}button+button{background:transparent;color:#c4f677}button:focus-visible{outline:3px solid white;outline-offset:5px}</style><button type="button" id="yes">是</button><button type="button" id="no">否</button><script>document.getElementById('yes').onclick=function(){alert('你选择了：是')};document.getElementById('no').onclick=function(){alert('你选择了：否')};</script></html>
